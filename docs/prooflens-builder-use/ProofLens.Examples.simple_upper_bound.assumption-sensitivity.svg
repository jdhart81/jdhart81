<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 604" width="100%" preserveAspectRatio="xMidYMin meet" role="img" aria-labelledby="pl-ProofLens-Examples-simple_upper_bound-assumptions-title pl-ProofLens-Examples-simple_upper_bound-assumptions-desc" class="prooflens-figure" data-prooflens-type="assumption-sensitivity" data-prooflens-epistemic="derived"><title id="pl-ProofLens-Examples-simple_upper_bound-assumptions-title">Which assumptions the proof actually uses</title><desc id="pl-ProofLens-Examples-simple_upper_bound-assumptions-desc">Which assumptions the proof actually uses. This figure shows two columns of boxes: the theorem&apos;s stated hypotheses on the left, the conclusion on the right, with a connector drawn for each hypothesis the proof term actually uses. Epistemic status: derived. Computed from the extracted statement by a deterministic rule; not a new proof. 2 of the stated hypotheses (hP, hT) are never used by the proof. Why this figure: `hP`, `hT` do not occur in the elaborated proof term, in any later hypothesis type, or in the conclusion.</desc><style>:root{--pl-bg:#ffffff;--pl-panel:#f5f7f9;--pl-border:#d6dbe1;--pl-fg:#151a20;--pl-muted:#586170;--pl-faint:#7d8794;--pl-axis:#39424e;--pl-accent:#1f5fbf;--pl-accent-soft:#e2ecfb;--pl-permit:#1c6f47;--pl-permit-fill:#dcefe4;--pl-exclude:#a03521;--pl-exclude-fill:#f8e5e0;--pl-warn:#8f2711;--pl-warn-bg:#fdeae4;--pl-warn-border:#e7a48f;--pl-edge:#6a7482;--pl-unused:#8a93a0}@media (prefers-color-scheme:dark){:root{--pl-bg:#12161b;--pl-panel:#1b212a;--pl-border:#303a47;--pl-fg:#e9edf2;--pl-muted:#a6b0bc;--pl-faint:#7d8895;--pl-axis:#b8c2ce;--pl-accent:#7fb0ff;--pl-accent-soft:#1c2b41;--pl-permit:#6ed49e;--pl-permit-fill:#16301f;--pl-exclude:#ff9c84;--pl-exclude-fill:#3a1c16;--pl-warn:#ffb3a0;--pl-warn-bg:#38160f;--pl-warn-border:#7c3827;--pl-edge:#8d98a6;--pl-unused:#7d8895}}.pl-bg{fill:var(--pl-bg)}text{font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;fill:var(--pl-fg);white-space:pre}.pl-mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace}.pl-title{font-size:17px;font-weight:600;fill:var(--pl-fg)}.pl-subtitle{font-size:11px;fill:var(--pl-muted);letter-spacing:.08em}.pl-status{font-size:10.5px;fill:var(--pl-faint);letter-spacing:.06em}.pl-heading{font-size:10px;fill:var(--pl-faint);letter-spacing:.1em;font-weight:600}.pl-label{font-size:12px;fill:var(--pl-fg)}.pl-label-strong{font-size:12.5px;font-weight:600;fill:var(--pl-fg)}.pl-detail{font-size:10.5px;fill:var(--pl-muted)}.pl-tick{font-size:10px;fill:var(--pl-muted)}.pl-axis-title{font-size:10.5px;fill:var(--pl-muted)}.pl-axis{stroke:var(--pl-axis);stroke-width:1.5;fill:none;stroke-linecap:round}.pl-guide{stroke:var(--pl-border);stroke-width:1;fill:none;stroke-dasharray:2 3}.pl-schematic{stroke-dasharray:7 4}.pl-marker{stroke:var(--pl-accent);stroke-width:2;fill:none;stroke-linecap:round}.pl-dot{fill:var(--pl-accent);stroke:none}.pl-dot-open{fill:var(--pl-bg);stroke:var(--pl-accent);stroke-width:2.25}.pl-region-permit{fill:var(--pl-permit-fill);stroke:var(--pl-permit);stroke-width:1}.pl-region-exclude{fill:var(--pl-exclude-fill);stroke:var(--pl-exclude);stroke-width:1}.pl-permit-text{font-size:10.5px;fill:var(--pl-permit);font-weight:600}.pl-exclude-text{font-size:10.5px;fill:var(--pl-exclude);font-weight:600}.pl-box{fill:var(--pl-panel);stroke:var(--pl-border);stroke-width:1}.pl-box-primary{fill:var(--pl-accent-soft);stroke:var(--pl-accent);stroke-width:1.5}.pl-box-unused{fill:var(--pl-bg);stroke:var(--pl-unused);stroke-width:1;stroke-dasharray:5 3}.pl-unused-text{fill:var(--pl-unused)}.pl-badge{font-size:9px;fill:var(--pl-unused);letter-spacing:.09em;font-weight:600}.pl-edge{stroke:var(--pl-edge);stroke-width:1.4;fill:none}.pl-edge-used{stroke:var(--pl-accent);stroke-width:1.75;fill:none}.pl-curve{stroke:var(--pl-accent);stroke-width:2.25;fill:none;stroke-linecap:round}.pl-asymptote{stroke:var(--pl-accent);stroke-width:1.5;fill:none;stroke-dasharray:1 4;stroke-linecap:round}.pl-rule{stroke:var(--pl-border);stroke-width:1}.pl-rationale-bar{fill:var(--pl-accent);stroke:none}.pl-rationale{font-size:12px;fill:var(--pl-fg)}.pl-warn-box{fill:var(--pl-warn-bg);stroke:var(--pl-warn-border);stroke-width:1.25}.pl-warn-text{font-size:11.5px;fill:var(--pl-warn);font-weight:600}.pl-note{font-size:10.5px;fill:var(--pl-muted)}.pl-weak-stroke{stroke-dasharray:5 3}.pl-weak-fill{fill-opacity:.55}.pl-weak-text{fill:var(--pl-muted)}</style><defs><marker id="pl-ProofLens-Examples-simple_upper_bound-assumptions-arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--pl-accent)"/></marker><marker id="pl-ProofLens-Examples-simple_upper_bound-assumptions-arrow-muted" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--pl-edge)"/></marker></defs><rect x="0" y="0" width="720" height="604" class="pl-bg"/><text x="24" y="26" class="pl-title">Which assumptions the proof actually uses</text><text x="24" y="42" class="pl-subtitle"><title>simple_upper_bound</title>SIMPLE_UPPER_BOUND</text><text x="24" y="58" class="pl-status"><title>assumption-sensitivity: Computed from the extracted statement by a deterministic rule; not a new proof.</title>ASSUMPTION-SENSITIVITY · DERIVED</text><line x1="24" y1="66" x2="696" y2="66" class="pl-rule"/><g transform="translate(0 62)"><text x="24" y="12" class="pl-heading">USED BY THE PROOF TERM (1)</text><rect x="24" y="24" width="296" height="49" rx="5" ry="5" class="pl-box"><title>h — x ≤ P / T — state: used — epistemic status: derived</title></rect><text x="34" y="46" class="pl-label-strong pl-mono"><title>h — x ≤ P / T — state: used — epistemic status: derived</title>h</text><text x="34" y="61" class="pl-detail pl-mono">x ≤ P / T</text><line x1="24" y1="87" x2="320" y2="87" class="pl-rule"/><text x="24" y="99" class="pl-heading">STATED BUT NEVER USED (2)</text><rect x="24" y="111" width="296" height="63" rx="5" ry="5" class="pl-box-unused"><title>hP — 0 &lt; P — state: unused — epistemic status: derived</title></rect><text x="34" y="133" class="pl-label-strong pl-mono pl-unused-text"><title>hP — 0 &lt; P — state: unused — epistemic status: derived</title>hP</text><text x="34" y="148" class="pl-detail pl-mono pl-unused-text">0 &lt; P</text><text x="34" y="162" class="pl-badge">NEVER USED IN THIS PROOF</text><rect x="24" y="184" width="296" height="63" rx="5" ry="5" class="pl-box-unused"><title>hT — 0 &lt; T — state: unused — epistemic status: derived</title></rect><text x="34" y="206" class="pl-label-strong pl-mono pl-unused-text"><title>hT — 0 &lt; T — state: unused — epistemic status: derived</title>hT</text><text x="34" y="221" class="pl-detail pl-mono pl-unused-text">0 &lt; T</text><text x="34" y="235" class="pl-badge">NEVER USED IN THIS PROOF</text><path d="M 320 48.5 C 356 48.5 364 48.5 400 48.5" class="pl-edge-used" marker-end="url(#pl-ProofLens-Examples-simple_upper_bound-assumptions-arrow)"><title>h is used to prove the conclusion — epistemic status: derived</title></path><text x="400" y="18.5" class="pl-heading">CONCLUSION</text><rect x="400" y="28.5" width="296" height="40" rx="5" ry="5" class="pl-box-primary"><title>x ≤ P / T — epistemic status: derived</title></rect><text x="410" y="50.5" class="pl-label pl-mono">x ≤ P / T</text></g><g transform="translate(0 355)"><line x1="24" y1="0" x2="696" y2="0" class="pl-rule"/><text x="24" y="16" class="pl-heading">HOW TO READ THIS FIGURE</text><rect x="24" y="29" width="22" height="12" rx="3" ry="3" class="pl-box-primary"/><text x="54" y="39" class="pl-note">Connected box: the elaborated proof term references this hypothesis.</text><rect x="24" y="47" width="22" height="12" rx="3" ry="3" class="pl-box-unused"/><text x="54" y="57" class="pl-note">Detached, dashed box: the hypothesis is stated but never referenced by this proof. That is a fact about the proof, not about</text><text x="54" y="70" class="pl-note">mathematical necessity — another proof might need it.</text><path d="M 24 82 L 40 82" class="pl-edge" marker-end="url(#pl-ProofLens-Examples-simple_upper_bound-assumptions-arrow)"/><text x="54" y="86" class="pl-note">An arrow means “this assumption is used in deriving the conclusion”.</text><text x="54" y="104" class="pl-note">This figure as a whole is derived. Computed from the extracted statement by a deterministic rule; not a new proof.</text></g><g transform="translate(0 490)"><line x1="24" y1="0" x2="696" y2="0" class="pl-rule"/><rect x="24" y="14" width="3" height="16" rx="1.5" ry="1.5" class="pl-rationale-bar"><title>Why this figure was chosen — derived: Computed from the extracted statement by a deterministic rule; not a new proof.</title></rect><text x="36" y="25" class="pl-rationale">`hP`, `hT` do not occur in the elaborated proof term, in any later hypothesis type, or in the conclusion.</text><text x="24" y="50" class="pl-note">• 2 of 3 hypotheses are never used.</text><text x="24" y="68" class="pl-note">— Detached hypotheses do not occur in this proof term. A different proof of the same statement might need them, so this is a fact</text><text x="24" y="81.5" class="pl-note">about the proof, not about mathematical necessity.</text></g></svg>
