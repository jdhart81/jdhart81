<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 517" width="100%" preserveAspectRatio="xMidYMin meet" role="img" aria-labelledby="pl-ProofLens-Examples-simple_upper_bound-upper-bound-title pl-ProofLens-Examples-simple_upper_bound-upper-bound-desc" class="prooflens-figure" data-prooflens-type="upper-bound-plot" data-prooflens-epistemic="illustrative"><title id="pl-ProofLens-Examples-simple_upper_bound-upper-bound-title">x ≤ P / T</title><desc id="pl-ProofLens-Examples-simple_upper_bound-upper-bound-desc">x ≤ P / T. This figure shows a horizontal number line showing the ranges permitted and excluded by the stated bound. Epistemic status: illustrative. A display choice. It makes no mathematical claim. Elements drawn with dashed strokes are illustrative and make no mathematical claim. Why this figure: The conclusion `x ≤ P / T` puts `x` on the smaller side of `≤`, so `P / T` is an upper bound for it.</desc><style>:root{--pl-bg:#ffffff;--pl-panel:#f5f7f9;--pl-border:#d6dbe1;--pl-fg:#151a20;--pl-muted:#586170;--pl-faint:#7d8794;--pl-axis:#39424e;--pl-accent:#1f5fbf;--pl-accent-soft:#e2ecfb;--pl-permit:#1c6f47;--pl-permit-fill:#dcefe4;--pl-exclude:#a03521;--pl-exclude-fill:#f8e5e0;--pl-warn:#8f2711;--pl-warn-bg:#fdeae4;--pl-warn-border:#e7a48f;--pl-edge:#6a7482;--pl-unused:#8a93a0}@media (prefers-color-scheme:dark){:root{--pl-bg:#12161b;--pl-panel:#1b212a;--pl-border:#303a47;--pl-fg:#e9edf2;--pl-muted:#a6b0bc;--pl-faint:#7d8895;--pl-axis:#b8c2ce;--pl-accent:#7fb0ff;--pl-accent-soft:#1c2b41;--pl-permit:#6ed49e;--pl-permit-fill:#16301f;--pl-exclude:#ff9c84;--pl-exclude-fill:#3a1c16;--pl-warn:#ffb3a0;--pl-warn-bg:#38160f;--pl-warn-border:#7c3827;--pl-edge:#8d98a6;--pl-unused:#7d8895}}.pl-bg{fill:var(--pl-bg)}text{font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;fill:var(--pl-fg);white-space:pre}.pl-mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace}.pl-title{font-size:17px;font-weight:600;fill:var(--pl-fg)}.pl-subtitle{font-size:11px;fill:var(--pl-muted);letter-spacing:.08em}.pl-status{font-size:10.5px;fill:var(--pl-faint);letter-spacing:.06em}.pl-heading{font-size:10px;fill:var(--pl-faint);letter-spacing:.1em;font-weight:600}.pl-label{font-size:12px;fill:var(--pl-fg)}.pl-label-strong{font-size:12.5px;font-weight:600;fill:var(--pl-fg)}.pl-detail{font-size:10.5px;fill:var(--pl-muted)}.pl-tick{font-size:10px;fill:var(--pl-muted)}.pl-axis-title{font-size:10.5px;fill:var(--pl-muted)}.pl-axis{stroke:var(--pl-axis);stroke-width:1.5;fill:none;stroke-linecap:round}.pl-guide{stroke:var(--pl-border);stroke-width:1;fill:none;stroke-dasharray:2 3}.pl-schematic{stroke-dasharray:7 4}.pl-marker{stroke:var(--pl-accent);stroke-width:2;fill:none;stroke-linecap:round}.pl-dot{fill:var(--pl-accent);stroke:none}.pl-dot-open{fill:var(--pl-bg);stroke:var(--pl-accent);stroke-width:2.25}.pl-region-permit{fill:var(--pl-permit-fill);stroke:var(--pl-permit);stroke-width:1}.pl-region-exclude{fill:var(--pl-exclude-fill);stroke:var(--pl-exclude);stroke-width:1}.pl-permit-text{font-size:10.5px;fill:var(--pl-permit);font-weight:600}.pl-exclude-text{font-size:10.5px;fill:var(--pl-exclude);font-weight:600}.pl-box{fill:var(--pl-panel);stroke:var(--pl-border);stroke-width:1}.pl-box-primary{fill:var(--pl-accent-soft);stroke:var(--pl-accent);stroke-width:1.5}.pl-box-unused{fill:var(--pl-bg);stroke:var(--pl-unused);stroke-width:1;stroke-dasharray:5 3}.pl-unused-text{fill:var(--pl-unused)}.pl-badge{font-size:9px;fill:var(--pl-unused);letter-spacing:.09em;font-weight:600}.pl-edge{stroke:var(--pl-edge);stroke-width:1.4;fill:none}.pl-edge-used{stroke:var(--pl-accent);stroke-width:1.75;fill:none}.pl-curve{stroke:var(--pl-accent);stroke-width:2.25;fill:none;stroke-linecap:round}.pl-asymptote{stroke:var(--pl-accent);stroke-width:1.5;fill:none;stroke-dasharray:1 4;stroke-linecap:round}.pl-rule{stroke:var(--pl-border);stroke-width:1}.pl-rationale-bar{fill:var(--pl-accent);stroke:none}.pl-rationale{font-size:12px;fill:var(--pl-fg)}.pl-warn-box{fill:var(--pl-warn-bg);stroke:var(--pl-warn-border);stroke-width:1.25}.pl-warn-text{font-size:11.5px;fill:var(--pl-warn);font-weight:600}.pl-note{font-size:10.5px;fill:var(--pl-muted)}.pl-weak-stroke{stroke-dasharray:5 3}.pl-weak-fill{fill-opacity:.55}.pl-weak-text{fill:var(--pl-muted)}</style><defs><marker id="pl-ProofLens-Examples-simple_upper_bound-upper-bound-arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--pl-accent)"/></marker><marker id="pl-ProofLens-Examples-simple_upper_bound-upper-bound-arrow-muted" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--pl-edge)"/></marker></defs><rect x="0" y="0" width="720" height="517" class="pl-bg"/><text x="24" y="26" class="pl-title">x ≤ P / T</text><text x="24" y="42" class="pl-subtitle"><title>power-limited rate bound</title>POWER-LIMITED RATE BOUND</text><text x="24" y="58" class="pl-status"><title>upper-bound-plot: A display choice. It makes no mathematical claim.</title>UPPER-BOUND-PLOT · ILLUSTRATIVE</text><line x1="24" y1="66" x2="696" y2="66" class="pl-rule"/><g transform="translate(0 62)"><defs><pattern id="pl-ProofLens-Examples-simple_upper_bound-upper-bound-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="var(--pl-exclude)" stroke-width="1.25" opacity="0.42"/></pattern></defs><rect x="36" y="50" width="324" height="48" rx="3" ry="3" class="pl-region-permit"><title>x may lie here — state: permitted — epistemic status: derived</title></rect><text x="198" y="92" class="pl-permit-text" text-anchor="middle"><title>x may lie here — state: permitted — epistemic status: derived</title>x may lie here</text><rect x="360" y="50" width="324" height="48" rx="3" ry="3" class="pl-region-exclude"><title>excluded by the stated bound — state: excluded — epistemic status: derived</title></rect><rect x="360" y="50" width="324" height="48" rx="3" ry="3" fill="url(#pl-ProofLens-Examples-simple_upper_bound-upper-bound-hatch)" stroke="none"/><text x="522" y="92" class="pl-exclude-text" text-anchor="middle"><title>excluded by the stated bound — state: excluded — epistemic status: derived</title>excluded by the stated bound</text><line x1="28" y1="74" x2="692" y2="74" class="pl-axis pl-schematic pl-weak-stroke"><title>achieved operation rate — schematic axis, epistemic status: illustrative</title></line><line x1="360" y1="98" x2="360" y2="104" class="pl-axis"><title>P / T</title></line><text x="360" y="118" class="pl-tick" text-anchor="middle">P / T</text><text x="28" y="136" class="pl-axis-title"><title>achieved operation rate (ops/s) — schematic axis</title>achieved operation rate (ops/s) · schematic scale</text><circle cx="243.36" cy="74" r="5" class="pl-dot"><title>x — achieved operation rate (ops/s) — state: permitted — epistemic status: derived</title></circle><text x="243.36" y="34" class="pl-label pl-mono" text-anchor="middle"><title>x — achieved operation rate (ops/s) — state: permitted — epistemic status: derived</title>x  ·  achieved operation rate (ops/s)</text><line x1="360" y1="42" x2="360" y2="106" class="pl-marker"><title>P / T — state: permitted — epistemic status: derived</title></line><circle cx="360" cy="74" r="5.5" class="pl-dot"><title>P / T — state: permitted — epistemic status: derived — filled circle: the bound is included (non-strict)</title></circle><text x="360" y="16" class="pl-label-strong pl-mono" text-anchor="middle"><title>P / T — state: permitted — epistemic status: derived</title>P / T</text></g><g transform="translate(0 228)"><line x1="24" y1="0" x2="696" y2="0" class="pl-rule"/><text x="24" y="16" class="pl-heading">HOW TO READ THIS FIGURE</text><rect x="24" y="29" width="22" height="12" rx="2" ry="2" class="pl-region-permit"/><text x="54" y="39" class="pl-note">Solid band: the range of values the stated bound permits.</text><rect x="24" y="47" width="22" height="12" rx="2" ry="2" class="pl-region-exclude"/><text x="54" y="57" class="pl-note">Hatched band: values the stated bound excludes.</text><line x1="24" y1="71" x2="46" y2="71" class="pl-axis"/><circle cx="35" cy="71" r="5" class="pl-dot"/><text x="54" y="75" class="pl-note">Filled circle: the inequality is non-strict, so the bound value itself is permitted.</text><line x1="24" y1="89" x2="46" y2="89" class="pl-axis pl-schematic"/><text x="54" y="93" class="pl-note">Broken axis: the scale is schematic. Which side of the marker a quantity lies on is meaningful; the distance is not.</text><line x1="24" y1="107" x2="46" y2="107" class="pl-axis pl-schematic"/><text x="54" y="111" class="pl-note">Dashed strokes and lightened fills mark elements weaker than “derived” — illustrative choices made for legibility. They</text><text x="54" y="124" class="pl-note">carry no mathematical claim.</text><text x="54" y="140" class="pl-note">This figure as a whole is illustrative. A display choice. It makes no mathematical claim.</text></g><g transform="translate(0 399)"><line x1="24" y1="0" x2="696" y2="0" class="pl-rule"/><rect x="24" y="14" width="3" height="16" rx="1.5" ry="1.5" class="pl-rationale-bar"><title>Why this figure was chosen — illustrative: A display choice. It makes no mathematical claim.</title></rect><text x="36" y="25" class="pl-rationale">The conclusion `x ≤ P / T` puts `x` on the smaller side of `≤`, so `P / T` is an upper bound for it.</text><text x="24" y="50" class="pl-note">• Increasing P increases the bound.</text><text x="24" y="68" class="pl-note">• Increasing T decreases the bound.</text><text x="24" y="86" class="pl-note">— Positions in this figure are schematic. They show which side of the bound a quantity lies on, not how large anything is.</text></g></svg>
